packages:
  - "packages/*"
  - "examples/*"

# Single source of truth for dependency versions across the workspace.
# `catalog:` specifiers are replaced with these literals at publish time by
# `pnpm publish` — the release workflow must use pnpm, not npm, to publish.
catalog:
  # Tooling / linting
  "@biomejs/biome": "^2.5.3"
  "@commitlint/cli": "^19.3.0"
  "@commitlint/config-conventional": "^19.2.2"
  husky: "^9.0.11"
  typescript: "^5.9.3"

  # Build / test tooling
  tsc-alias: "^1.8.10"
  vitest: "^3.2.4"

  # Benchmark comparison baseline
  node-sql-parser: "5.1.0"
