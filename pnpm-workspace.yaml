packages:
  - "packages/*"
  - "examples/*"

# Single source of truth for dependency versions across the workspace.
# `catalog:` specifiers are replaced with these literals at publish time by
# `pnpm publish` — the release workflow must use pnpm, not npm, to publish.
catalog:
  # Tooling / linting
  "@biomejs/biome": "^2.5.3"
  "@changesets/changelog-github": "^0.5.0"
  "@changesets/cli": "^3.0.1"
  "@commitlint/cli": "^19.3.0"
  "@commitlint/config-conventional": "^19.2.2"
  husky: "^9.0.11"
  typescript: "^5.9.3"

  # Build / test tooling
  tsc-alias: "^1.8.10"
  esbuild: "^0.28.2"
  vitest: "^3.2.4"

  # Benchmark comparison baseline
  node-sql-parser: "5.1.0"
  "@dbml/core": "12.1.0"

  # Differential-test oracle: PostgreSQL 17's own parser as WASM. 17.7.4 bundles
  # libpg_query 17-6.1.0 (the upstream release, not the 17.8 line's fork).
  libpg-query: "17.7.4"
